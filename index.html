<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="NanStar Note 是一个面向个人技术笔记、纯文本速查和云同步访问的清爽笔记平台。"
    />
    <meta property="og:title" content="NanStar Note" />
    <meta property="og:description" content="个人技术笔记、纯文本速查、Markdown 预览、云同步入口。" />
    <meta property="og:type" content="website" />
    <title>NanStar Note</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="笔记导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">NN</div>
          <div>
            <h1>NanStar Note</h1>
            <p id="cloudStatus">本地模式</p>
          </div>
        </div>

        <div class="sidebar-actions">
          <button class="primary-button" id="newNoteButton" type="button">
            <span aria-hidden="true">+</span>
            <span>新建 TXT</span>
          </button>
          <button class="icon-button" id="syncButton" type="button" title="同步" aria-label="同步">
            <span aria-hidden="true">↻</span>
          </button>
        </div>

        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索标题、正文、标签" autocomplete="off" />
        </label>

        <nav class="filter-list" aria-label="笔记筛选">
          <button class="filter-item active" type="button" data-filter="all">
            <span>全部笔记</span>
            <strong id="allCount">0</strong>
          </button>
          <button class="filter-item" type="button" data-filter="pinned">
            <span>置顶</span>
            <strong id="pinnedCount">0</strong>
          </button>
          <button class="filter-item" type="button" data-filter="favorite">
            <span>星标</span>
            <strong id="favoriteCount">0</strong>
          </button>
          <button class="filter-item" type="button" data-filter="recent">
            <span>最近编辑</span>
            <strong id="recentCount">0</strong>
          </button>
        </nav>

        <details class="nav-section">
          <summary class="panel-summary">
            <span>文件夹</span>
            <button class="text-button" id="clearFolderButton" type="button">全部</button>
          </summary>
          <div class="folder-list" id="folderList"></div>
        </details>

        <details class="nav-section">
          <summary class="panel-summary">
            <span>标签</span>
            <button class="text-button" id="clearTagButton" type="button">清除</button>
          </summary>
          <div class="tag-list" id="tagList"></div>
        </details>

        <details class="nav-section">
          <summary class="panel-summary">
            <span>目录</span>
            <span id="outlineStatus">MD</span>
          </summary>
          <div class="outline-list" id="outlineList"></div>
        </details>

        <section class="note-list-panel" aria-labelledby="noteListTitle">
          <div class="panel-title">
            <h2 id="noteListTitle">笔记列表</h2>
            <span id="listStatus">0 条</span>
          </div>
          <div class="note-list" id="noteList" aria-live="polite"></div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <p class="eyebrow">NanStar Note / Content Desk</p>
            <h2>内容工作台</h2>
          </div>
          <div class="topbar-actions">
            <button class="primary-button" id="topSyncButton" type="button">同步</button>
            <button class="ghost-button" id="importButton" type="button">导入</button>
            <button class="ghost-button" id="exportButton" type="button">导出</button>
            <button class="ghost-button" id="shareButton" type="button">分享</button>
            <button class="danger-button" id="deleteButton" type="button">删除</button>
          </div>
        </header>

        <section class="quick-strip" aria-label="新建模板">
          <button class="quick-chip active" type="button" data-template="txt">TXT 空白</button>
          <button class="quick-chip" type="button" data-template="md">Markdown</button>
          <button class="quick-chip" type="button" data-template="command">命令速查</button>
          <button class="quick-chip" type="button" data-template="client">客户现场</button>
          <button class="quick-chip" type="button" data-template="debug">问题排查</button>
          <button class="quick-chip" type="button" data-template="daily">日常记录</button>
        </section>

        <article class="editor-card" id="editorCard" aria-labelledby="editorTitle">
          <div class="note-meta">
            <input
              id="titleInput"
              class="title-input"
              type="text"
              placeholder="写一个清晰的标题"
              autocomplete="off"
            />
            <div class="note-flags">
              <button class="flag-button" id="pinButton" type="button" aria-label="置顶" title="置顶">⌃</button>
              <button class="flag-button" id="favoriteButton" type="button" aria-label="星标" title="星标">☆</button>
            </div>
          </div>

          <div class="meta-row">
            <div class="segmented" aria-label="编辑模式">
              <button class="mode-button active" type="button" data-mode="txt">TXT</button>
              <button class="mode-button" type="button" data-mode="md">MD</button>
            </div>
            <input id="folderInput" class="folder-input" type="text" placeholder="文件夹，例如：WK / 客户现场" />
            <input id="tagsInput" class="tags-input" type="text" placeholder="标签，用逗号分隔，例如：wk, 编译, ssh" />
          </div>

          <div class="toolbar" aria-label="编辑工具">
            <button type="button" data-command="undo" title="撤回 Ctrl+Z">↶</button>
            <button type="button" data-command="redo" title="重做 Ctrl+Y">↷</button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button class="md-tool" type="button" data-wrap="**" title="加粗">B</button>
            <button class="md-tool" type="button" data-wrap="`" title="行内代码">{ }</button>
            <button class="md-tool" type="button" data-prefix="- " title="无序列表">•</button>
            <button class="md-tool" type="button" data-prefix="1. " title="有序列表">1.</button>
            <button class="md-tool" type="button" data-prefix="- [ ] " title="任务清单">☐</button>
            <button class="md-tool" type="button" data-prefix="> " title="引用">❝</button>
            <button class="md-tool" type="button" data-block="code" title="代码块">&lt;/&gt;</button>
            <span class="toolbar-separator" aria-hidden="true"></span>
            <button type="button" data-insert="path" title="插入路径片段">路径</button>
            <button type="button" data-insert="command" title="插入命令片段">命令</button>
            <button type="button" data-insert="checklist" title="插入检查清单">清单</button>
            <button class="md-only" id="togglePreviewButton" type="button" title="显示或隐藏预览">预览</button>
          </div>

          <div class="editor-status-bar">
            <span id="saveStatus">已保存本地</span>
            <span id="syncState">本地</span>
            <span id="wordCount">0 字</span>
          </div>

          <div class="split-editor" id="splitEditor">
            <section class="write-pane" aria-labelledby="editorTitle">
              <div class="pane-head">
                <h3 id="editorTitle">编辑</h3>
                <span id="modeHint">TXT 纯文本模式</span>
              </div>
              <div class="text-shell" id="textShell">
                <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
                <textarea
                  id="bodyInput"
                  spellcheck="false"
                  placeholder="纯文本适合放路径、账号检查清单、命令备忘；Markdown 适合结构化文档。Ctrl+Z / Ctrl+Y 保持浏览器原生编辑习惯。"
                ></textarea>
              </div>
            </section>

            <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="调整编辑和预览宽度"></div>

            <section class="preview-pane" id="previewPane" aria-labelledby="previewTitle">
              <div class="pane-head">
                <h3 id="previewTitle">预览</h3>
                <div class="pane-actions">
                  <span>代码块可复制</span>
                  <button class="icon-button" id="previewFocusButton" type="button" title="专注预览" aria-label="专注预览">⤢</button>
                </div>
              </div>
              <div class="preview-content" id="previewContent"></div>
            </section>
          </div>
        </article>

        <details class="utility-drawer">
          <summary>更多操作与状态</summary>
          <div class="utility-grid">
            <button class="ghost-button" id="copyMarkdownButton" type="button">复制当前内容</button>
            <button class="ghost-button" id="downloadNoteButton" type="button">导出 TXT/MD</button>
            <button class="ghost-button" id="duplicateButton" type="button">复制为新笔记</button>
            <span id="createdAt">创建 -</span>
            <span id="updatedAt">更新 -</span>
          </div>
        </details>
      </main>
    </div>

    <dialog class="modal" id="syncDialog">
      <form method="dialog" class="modal-card" id="syncForm">
        <div class="modal-head">
          <div>
            <p class="eyebrow">Cloudflare Sync</p>
            <h2>同步设置</h2>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <p class="modal-copy">
          使用 Cloudflare Pages Functions + D1 保存云端笔记。客户电脑建议使用无痕窗口，离开时清除 Token。
        </p>
        <label class="field">
          <span>同步 Token</span>
          <input id="syncTokenInput" type="password" placeholder="NOTE_SYNC_TOKEN" autocomplete="current-password" />
        </label>
        <label class="toggle-field">
          <input id="autoSyncToggle" type="checkbox" />
          <span>编辑后自动推送到云端</span>
        </label>
        <div class="sync-grid">
          <button class="primary-button" id="pushCloudButton" type="button">推送到云端</button>
          <button class="ghost-button" id="pullCloudButton" type="button">从云端拉取并合并</button>
          <button class="ghost-button" id="logoutCloudButton" type="button">清除 Token</button>
        </div>
        <div class="sync-message" id="syncMessage">未连接云同步，本地编辑可正常使用。</div>
      </form>
    </dialog>

    <input id="importFileInput" type="file" accept=".json,.md,.txt" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js"></script>
  </body>
</html>
