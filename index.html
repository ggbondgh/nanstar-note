<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="NanStar Note 是一个面向个人技术笔记、纯文本速查和云同步访问的清爽笔记平台。"
    />
    <meta property="og:title" content="NanStar Note" />
    <meta property="og:description" content="个人技术笔记、纯文本速查、Markdown 预览、云同步入口。" />
    <meta property="og:type" content="website" />
    <title>NanStar Note</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="笔记导航">
        <button class="sidebar-toggle-button" id="sidebarToggleButton" type="button" title="收起侧栏" aria-label="收起侧栏">
          <span class="toggle-icon" aria-hidden="true">‹</span>
        </button>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">NN</div>
          <div>
            <h1>NanStar Note</h1>
            <p id="cloudStatus">本地模式</p>
          </div>
        </div>

        <div class="sidebar-actions">
          <button class="primary-button" id="newNoteButton" type="button">
            <span aria-hidden="true">+</span>
            <span>新建笔记</span>
          </button>
          <button class="icon-button" id="syncButton" type="button" title="同步" aria-label="同步">
            <span aria-hidden="true">↻</span>
          </button>
        </div>

        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索笔记..." autocomplete="off" />
          <button class="search-clear" id="searchClearButton" type="button" title="清除搜索" hidden>✕</button>
        </label>

        <details class="nav-section" id="folderSection">
          <summary class="panel-summary">
            <span id="folderSectionTitle">文件夹</span>
            <button class="icon-button folder-add-button" id="folderAddButton" type="button"
                    title="新建文件夹" aria-label="新建文件夹">+</button>
          </summary>
          <div class="folder-list" id="folderList"></div>
        </details>

        <section class="note-list-panel" aria-labelledby="noteListTitle">
          <div class="note-list-header">
            <div class="note-list-tabs">
              <button class="filter-tab active" data-filter="all" type="button">全部</button>
              <button class="filter-tab" data-filter="favorite" type="button">★ 收藏</button>
            </div>
            <span class="note-list-count" id="listStatus">0 条</span>
          </div>
          <div class="note-list" id="noteList" aria-live="polite"></div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <p class="eyebrow">NanStar Note / Content Desk</p>
            <h2>内容工作台</h2>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="languageToggleButton" type="button" title="切换语言" aria-label="切换语言">中</button>
            <button class="icon-button topbar-new-button" id="sidebarQuickNewButton" type="button" title="新建笔记" aria-label="新建笔记">＋</button>
            <button class="primary-button" id="topSyncButton" type="button">同步</button>
            <button class="ghost-button" id="importButton" type="button">导入</button>
            <button class="ghost-button" id="exportButton" type="button">导出当前</button>
            <button class="ghost-button" id="shareButton" type="button">分享</button>
            <button class="danger-button" id="deleteButton" type="button">删除</button>
          </div>
        </header>

        <article class="editor-card" id="editorCard" aria-labelledby="editorTitle">
          <section class="editor-header">
            <div class="note-meta">
              <input
                id="titleInput"
                class="title-input"
                type="text"
                placeholder="写一个清晰的标题"
                autocomplete="off"
              />
            </div>

            <details class="editor-section" id="editorSection">
              <summary class="panel-summary editor-summary">
                <span class="summary-title">
                  <span class="summary-mark" aria-hidden="true">▸</span>
                  <span id="editorToolsTitle">编辑工具</span>
                </span>
                <span class="summary-meta" id="editorSectionState">TXT</span>
              </summary>
              <div class="editor-section-body">
                <div class="meta-row">
                  <div class="segmented segmented-tight" aria-label="编辑模式">
                    <button class="mode-button active" type="button" data-mode="txt">TXT</button>
                    <button class="mode-button" type="button" data-mode="md">MD</button>
                  </div>
                  <input id="folderInput" class="folder-input" type="text"
                         placeholder="文件夹，例如：WK / 客户现场"
                         list="folderDatalist" autocomplete="off" />
                  <datalist id="folderDatalist"></datalist>
                </div>

                <div class="find-bar" id="editorFindBar" hidden>
                  <label class="find-field" for="editorSearchInput">
                    <span aria-hidden="true">⌕</span>
                    <input id="editorSearchInput" type="search" placeholder="查找当前笔记内容" autocomplete="off" />
                  </label>
                  <span class="find-count" id="editorSearchCount">0 / 0</span>
                  <button class="icon-button" id="editorSearchPrevButton" type="button" title="上一个匹配" aria-label="上一个匹配">↑</button>
                  <button class="icon-button" id="editorSearchNextButton" type="button" title="下一个匹配" aria-label="下一个匹配">↓</button>
                  <button class="icon-button" id="editorSearchCloseButton" type="button" title="关闭搜索" aria-label="关闭搜索">×</button>
                </div>

                <div class="toolbar" aria-label="编辑工具">
                  <button type="button" data-command="undo" title="撤回 Ctrl+Z">↶</button>
                  <button type="button" data-command="redo" title="重做 Ctrl+Y">↷</button>
                  <span class="toolbar-separator" aria-hidden="true"></span>
                  <button class="md-tool" type="button" data-wrap="**" title="加粗">B</button>
                  <button class="md-tool" type="button" data-wrap="`" title="行内代码">{ }</button>
                  <button class="md-tool" type="button" data-prefix="- " title="无序列表">•</button>
                  <button class="md-tool" type="button" data-prefix="1. " title="有序列表">1.</button>
                  <button class="md-tool" type="button" data-prefix="- [ ] " title="任务清单">☐</button>
                  <button class="md-tool" type="button" data-prefix="> " title="引用">❝</button>
                  <button class="md-tool" type="button" data-block="code" title="代码块">&lt;/&gt;</button>
                  <span class="toolbar-separator" aria-hidden="true"></span>
                  <button type="button" data-insert="path" title="插入路径片段">路径</button>
                  <button type="button" data-insert="command" title="插入命令片段">命令</button>
                  <button type="button" data-insert="checklist" title="插入检查清单">清单</button>
                  <button class="md-only" id="togglePreviewButton" type="button" title="显示或隐藏预览">预览</button>
                </div>

                <div class="editor-status-bar">
                  <span id="saveStatus">已保存本地</span>
                  <span id="syncState">本地</span>
                  <span id="wordCount">0 字</span>
                </div>
              </div>
            </details>
          </section>

          <div class="split-editor" id="splitEditor">
            <section class="write-pane" aria-labelledby="editorTitle">
              <div class="pane-head">
                <h3 id="editorTitle">编辑</h3>
              </div>
              <div class="text-shell" id="textShell">
                <div class="editor-line-highlight" id="editorLineHighlight" aria-hidden="true"></div>
                <div class="line-numbers" id="lineNumbers" aria-hidden="true">1</div>
                <textarea
                  id="bodyInput"
                  spellcheck="false"
                  placeholder="纯文本适合放路径、账号检查清单、命令备忘；Markdown 适合结构化文档。Ctrl+Z / Ctrl+Y 保持浏览器原生编辑习惯。"
                ></textarea>
              </div>
            </section>

            <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="调整编辑和预览宽度"></div>

            <section class="preview-pane" id="previewPane" aria-labelledby="previewTitle">
              <div class="pane-head">
                <h3 id="previewTitle">预览</h3>
                <div class="pane-actions">
                  <button class="icon-button" id="previewFocusButton" type="button" title="专注预览" aria-label="专注预览">⤢</button>
                </div>
              </div>
              <div class="preview-content" id="previewContent"></div>
            </section>

            <aside class="floating-outline" id="floatingOutline" aria-label="文档目录" hidden>
              <div class="outline-rail" id="outlineRail" title="文档目录">
                <div class="outline-dots" id="outlineDots"></div>
              </div>
              <div class="outline-panel" id="outlinePanel">
                <div class="outline-panel-head">
                  <span>目录</span>
                </div>
                <div class="outline-panel-body" id="outlinePanelBody"></div>
              </div>
            </aside>
          </div>
        </article>

        <details class="utility-drawer">
          <summary id="utilityDrawerTitle">备份与信息</summary>
          <div class="utility-grid">
            <button class="ghost-button" id="downloadNoteButton" type="button">备份全部 JSON</button>
            <span id="createdAt">创建 -</span>
            <span id="updatedAt">更新 -</span>
          </div>
        </details>
      </main>
    </div>

    <!-- 新建笔记文件夹选择对话框 -->
    <dialog class="modal" id="newNoteDialog">
      <form method="dialog" class="modal-card">
        <div class="modal-head">
          <h2 id="newNoteDialogTitle">新建笔记</h2>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <div class="field">
          <span id="newNoteFolderLabel">文件夹</span>
          <select id="newNoteFolderSelect"></select>
        </div>
        <div class="sync-grid">
          <button class="primary-button" id="newNoteConfirmBtn" type="button" value="confirm">创建</button>
        </div>
      </form>
    </dialog>

    <!-- 文件夹右键菜单 -->
    <div class="context-menu" id="folderContextMenu" hidden>
      <button class="context-menu-item" data-action="new-note" type="button">在此新建笔记</button>
      <button class="context-menu-item" data-action="rename" type="button">重命名</button>
      <button class="context-menu-item danger" data-action="delete" type="button">删除</button>
    </div>

    <!-- 笔记右键菜单 -->
    <div class="context-menu" id="noteContextMenu" hidden>
      <button class="context-menu-item" data-action="pin" type="button">📌 置顶/取消置顶</button>
      <button class="context-menu-item" data-action="favorite" type="button">★ 星标/取消星标</button>
      <div class="context-menu-sub" id="noteMoveSubmenu">
        <button class="context-menu-item move-trigger" data-action="move" type="button">移动到 ▸</button>
        <div class="context-sub-list" id="noteMoveList"></div>
      </div>
      <button class="context-menu-item" data-action="duplicate" type="button">复制为新笔记</button>
      <button class="context-menu-item" data-action="export" type="button">导出当前</button>
      <button class="context-menu-item danger" data-action="delete" type="button">删除</button>
    </div>

    <dialog class="modal" id="syncDialog">
      <form method="dialog" class="modal-card" id="syncForm">
        <div class="modal-head">
          <div>
            <p class="eyebrow" id="syncModalEyebrow">Cloudflare Sync</p>
            <h2 id="syncModalTitle">同步设置</h2>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <p class="modal-copy" id="syncModalCopy">
          使用 Cloudflare Pages Functions + D1 保存云端笔记。客户电脑建议使用无痕窗口，离开时清除 Token。
        </p>
        <label class="field">
          <span id="syncTokenLabel">同步 Token</span>
          <input id="syncTokenInput" type="password" placeholder="NOTE_SYNC_TOKEN" autocomplete="current-password" />
        </label>
        <label class="toggle-field">
          <input id="autoSyncToggle" type="checkbox" />
          <span id="autoSyncLabel">编辑后自动推送到云端</span>
        </label>
        <div class="sync-grid">
          <button class="primary-button" id="pushCloudButton" type="button">推送到云端</button>
          <button class="ghost-button" id="pullCloudButton" type="button">从云端拉取并合并</button>
          <button class="ghost-button" id="logoutCloudButton" type="button">清除 Token</button>
        </div>
        <div class="sync-message" id="syncMessage">未连接云同步，本地编辑可正常使用。</div>
      </form>
    </dialog>

    <input id="importFileInput" type="file" accept=".json,.md,.txt" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./script.js?v=4"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
